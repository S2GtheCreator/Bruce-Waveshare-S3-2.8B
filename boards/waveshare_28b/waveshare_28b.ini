[env:waveshare_28b]
board = waveshare_28b
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.partitions = custom_16Mb.csv
board_upload.flash_size = 16MB
extra_scripts =
    pre:boards/waveshare_28b/native_toolchain.py
    ${env.extra_scripts}
    post:boards/waveshare_28b/native_toolchain.py
build_src_filter = ${env.build_src_filter} +<../boards/waveshare_28b>
build_unflags =
    -DLH=8
    -DLW=6
    -DBRUCE_VERSION='"dev"'
    -DGIT_COMMIT_HASH='"Homebrew"'
build_flags =
    ${env.build_flags}
    -Iboards/waveshare_28b
    -DWAVESHARE_28B=1
    -DWS28B_TOUCH_PRO=1
    -DUSB_as_HID=1
    -DLH=10
    -DLW=8
    -DCORE_DEBUG_LEVEL=1
    -DUSE_SD_MMC=1
    -DBOARD_HAS_PSRAM=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBRUCE_VERSION='"1.16.1-ws28b-pro"'
    -DGIT_COMMIT_HASH='"ba519c936c87b89c9c667c15b932d7faca5360d5"'
    -DIR_TX_PINS='{{"None", -1}}'
    -DIR_RX_PINS='{{"None", -1}}'
    -DRF_TX_PINS='{{"None", -1}}'
    -DRF_RX_PINS='{{"None", -1}}'
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32-libs/esp32s3/include/fatfs/src
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32-libs/esp32s3/include/fatfs/vfs
    -I$PROJECT_PACKAGES_DIR/framework-arduinoespressif32-libs/esp32s3/include/fatfs/diskio
lib_deps = ${env.lib_deps}
lib_ignore = SD
